name: Build macOS Intel DMG

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-intel:
    # GitHub 的 macos-13 Intel runner 已退役；macos-latest 为 ARM，
    # 通过 Rust 交叉编译目标 x86_64-apple-darwin 产出 Intel 芯片包
    #（旧款 Intel Core i5 Mac 可直接安装运行）
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable + x86_64-apple-darwin target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Intel x86_64, app + dmg)
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles app,dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-work-assistant-macos-intel
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # 打 tag（v*）时自动发布 Release，附上 dmg
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
